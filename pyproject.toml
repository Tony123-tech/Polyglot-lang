[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-lang"
version = "0.3.0"
description = "A Rust-like language with Python and native PyO3 backends."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.8"
dependencies = [
    "ccloc>=0.1.6",
]

[project.scripts]
polyglot = "api.cli:main"

[tool.setuptools]
py-modules = [
    "ast_nodes",
    "lexer",
    "parser",
    "termination",
    "inline_lang",
    "match_diagnostics",
    "struct_order",
    "main",
    "_native_sources",
    "conftest",
    "include_expander",
]

[tool.setuptools.packages.find]
include = ["api*", "backends*"]

[tool.pytest.ini_options]
markers = [
    "native: marks tests that require a compiled native backend",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"

[tool.ruff.lint.per-file-ignores]
"tests/test_rust_compile_error.py" = ["ISC004"]
