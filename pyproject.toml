[project]
name = "polyglot-lang"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aider-install>=0.2.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
markers = [
    "native: marks tests that require a compiled native backend",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"
