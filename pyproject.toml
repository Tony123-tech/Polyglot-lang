[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-lang"
version = "0.3.8"
description = "A Rust-like language with Python and native PyO3 backends."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.8"
dependencies = [
    "lazyscan>=0.6.4",
]

[project.optional-dependencies]
dev = [
    "fastapi",
    "ccloc>=0.1.6",
    "pytest>=9.0",
    "pytest-xdist>=3.0",
    "ruff>=0.8",
]
wasm = [
    "wasmtime>=20.0",
]

[project.scripts]
polyglot = "api.cli:main"

[tool.setuptools]
# Top-level modules shipped in the wheel. Test modules (tests/) and developer
# tooling (tools/) are intentionally excluded: package discovery below only
# includes the runtime packages, and pytest collects tests/ from the sdist tree.
py-modules = [
    "ast_nodes",
    "lexer",
    "parser",
    "termination",
    "inline_lang",
    "match_diagnostics",
    "monomorph",
    "struct_order",
    "main",
    "_native_sources",
    "conftest",
    "include_expander",
]

[tool.setuptools.packages.find]
include = [
    "api*",
    "backends*",
    "bootstrap*",
    "compiler*",
    "debug*",
    "diagnostics*",
    "distributed*",
    "docs*",
    "framework_functions*",
    "proofs*",
    "regression*",
    "runtime*",
    "security*",
    "stdlib*",
    "swarm*",
    "tools.abi_contract*",
    "tools.adversarial*",
    "tools.build_ci*",
    "tools.dst*",
    "tools.provenance*",
    "zig*",
]

[tool.setuptools.package-data]
stdlib = ["*.poly"]
api = ["static/*.html"]

[tool.pytest.ini_options]
markers = [
    "native: marks tests that require a compiled native backend",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "generated: marks generated edge-case grids (python backend, no cargo)",
    "generated_heavy: marks optional generated grids that are too slow by default",
]
addopts = "-m 'not slow and not generated_heavy'"

[tool.ruff.lint]
ignore = ["ISC004", "BLE001", "B017"]
