# Full ordered release gate (tools/release_gate.py --full).
# CI-only: the worktree starts clean, so --allow-dirty is deliberately omitted.
name: Release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate (${{ matrix.os }}, Python ${{ matrix.python-version }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    # Full mode runs 12 fuzz seeds x 24 cases plus the whole pytest suite.
    timeout-minutes: 45
    # A native crash inside pytest exits with -11 and prints nothing useful
    # unless the fault handler is on; this makes the next segfault name its
    # Python frame instead of leaving a bare exit code in the gate table.
    env:
      PYTHONFAULTHANDLER: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.14"]
        rust: ["1.97.1"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The matrix `rust` value is the pin, not a channel name: see
      # `rust-toolchain.toml` for why 1.97.1 and not `stable`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native_pillars

      - name: Install Zig 0.17.1
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            macOS-ARM64) target=aarch64-macos ;;
            macOS-X64) target=x86_64-macos ;;
            Linux-X64) target=x86_64-linux ;;
            Linux-ARM64) target=aarch64-linux ;;
            *) echo "unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/download/0.17.1/zig-${target}-0.17.1.tar.xz" -o "${RUNNER_TEMP}/zig.tar.xz"
          mkdir -p "${RUNNER_TEMP}/zig"
          tar -xJf "${RUNNER_TEMP}/zig.tar.xz" -C "${RUNNER_TEMP}/zig" --strip-components=1
          echo "${RUNNER_TEMP}/zig" >> "${GITHUB_PATH}"

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev,wasm]"

      - name: Run full release gate
        run: python tools/release_gate.py --full

      - name: Upload release-gate artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .artifacts/
          if-no-files-found: ignore
