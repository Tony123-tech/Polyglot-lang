# Fast PR/push checks. See .github/workflows/release-gate.yml for the full
# ordered gate and .github/workflows/native-wheels.yml for native wheel builds;
# docs/native_distribution.md explains which steps are CI-only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Pinned to the compiler the native tests were written against: two of
      # them assert on rustc's own diagnostic wording, which drifts between
      # releases. `rust-toolchain.toml` is the same pin for local checkouts.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Zig 0.17.1
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            macOS-ARM64) target=aarch64-macos ;;
            macOS-X64) target=x86_64-macos ;;
            Linux-X64) target=x86_64-linux ;;
            Linux-ARM64) target=aarch64-linux ;;
            *) echo "unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/download/0.17.1/zig-${target}-0.17.1.tar.xz" -o "${RUNNER_TEMP}/zig.tar.xz"
          mkdir -p "${RUNNER_TEMP}/zig"
          tar -xJf "${RUNNER_TEMP}/zig.tar.xz" -C "${RUNNER_TEMP}/zig" --strip-components=1
          echo "${RUNNER_TEMP}/zig" >> "${GITHUB_PATH}"


      - name: Install package
        run: pip install -e ".[dev,wasm]"

      - name: Lint statement leaks
        run: python3 tools/lint_statement_leaks.py

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Lint docs
        run: python3 tools/lint_docs.py

      - name: Check docs sync
        run: python3 tools/check_docs_sync.py

      - name: Run fast tests
        run: pytest -q

      - name: Run slow tests
        timeout-minutes: 20
        run: pytest -q -m slow

      - name: Upload pytest cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache
          path: .pytest_cache

  gate:
    name: Quick release gate
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Pinned to the compiler the native tests were written against: two of
      # them assert on rustc's own diagnostic wording, which drifts between
      # releases. `rust-toolchain.toml` is the same pin for local checkouts.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native_pillars

      - name: Install Zig 0.17.1
        run: |
          set -euo pipefail
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            macOS-ARM64) target=aarch64-macos ;;
            macOS-X64) target=x86_64-macos ;;
            Linux-X64) target=x86_64-linux ;;
            Linux-ARM64) target=aarch64-linux ;;
            *) echo "unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/download/0.17.1/zig-${target}-0.17.1.tar.xz" -o "${RUNNER_TEMP}/zig.tar.xz"
          mkdir -p "${RUNNER_TEMP}/zig"
          tar -xJf "${RUNNER_TEMP}/zig.tar.xz" -C "${RUNNER_TEMP}/zig" --strip-components=1
          echo "${RUNNER_TEMP}/zig" >> "${GITHUB_PATH}"


      - name: Install package
        run: pip install -e ".[dev,wasm]"

      # Fast gate for PRs; the full ordered gate is in release-gate.yml.
      - name: Run quick release gate
        run: python tools/release_gate.py --quick
