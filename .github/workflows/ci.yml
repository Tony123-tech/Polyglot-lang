name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint statement leaks
        run: python3 tools/lint_statement_leaks.py

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Lint docs
        run: python3 tools/lint_docs.py

      - name: Check docs sync
        run: python3 tools/check_docs_sync.py

      - name: Run fast tests
        run: pytest -q

      - name: Run slow tests
        timeout-minutes: 20
        run: pytest -q -m slow

      - name: Upload pytest cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache
          path: .pytest_cache
