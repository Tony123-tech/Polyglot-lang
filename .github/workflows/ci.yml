# Fast PR/push checks. See .github/workflows/release-gate.yml for the full
# ordered gate and .github/workflows/native-wheels.yml for native wheel builds;
# docs/native_distribution.md explains which steps are CI-only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint statement leaks
        run: python3 tools/lint_statement_leaks.py

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Lint docs
        run: python3 tools/lint_docs.py

      - name: Check docs sync
        run: python3 tools/check_docs_sync.py

      - name: Run fast tests
        run: pytest -q

      - name: Run slow tests
        timeout-minutes: 20
        run: pytest -q -m slow

      - name: Upload pytest cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache
          path: .pytest_cache

  gate:
    name: Quick release gate
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native_pillars

      - name: Install package
        run: pip install -e ".[dev]"

      # Fast gate for PRs; the full ordered gate is in release-gate.yml.
      - name: Run quick release gate
        run: python tools/release_gate.py --quick
