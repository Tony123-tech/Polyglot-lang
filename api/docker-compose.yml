services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      POLYGLOT_EXECUTOR: docker
      POLYGLOT_TRUSTED_TOKEN: ${POLYGLOT_TRUSTED_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # nested docker (dev only)
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
